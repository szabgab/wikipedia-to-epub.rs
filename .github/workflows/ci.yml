name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  generate-books:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Generate book about Japan
        run: cargo run --locked -- books/japan.json

      - name: Generate book about Korea
        run: cargo run --locked -- books/korea.json

      - name: Upload generated EPUB files
        uses: actions/upload-artifact@v7
        with:
          name: generated-books
          path: "*.epub"
          if-no-files-found: error
