name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  build-binaries:
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: wikipedia-to-epub-linux
            binary_ext: ""
          - os: macos-latest
            artifact_name: wikipedia-to-epub-macos
            binary_ext: ""
          - os: windows-latest
            artifact_name: wikipedia-to-epub-windows
            binary_ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build executable
        run: cargo build --locked --release

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/wikipedia-to-epub${{ matrix.binary_ext }}
          if-no-files-found: error

  generate-books:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install jinja2

      - name: Generate book about Japan
        run: cargo run --locked -- books/japan.json

      - name: Generate book about Korea
        run: cargo run --locked -- books/korea.json

      - name: Upload generated EPUB files
        id: upload_books
        uses: actions/upload-artifact@v7
        with:
          name: generated-books
          path: "*.epub"
          if-no-files-found: error

      - name: Generate GitHub Pages site
        env:
          ARTIFACT_URL: ${{ steps.upload_books.outputs.artifact-url || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          python scripts/generate_site.py \
            --books-dir books \
            --template templates/site/index.html.j2 \
            --output-dir site \
            --artifact-url "$ARTIFACT_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-books
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
