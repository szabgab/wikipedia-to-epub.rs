name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Test ignored tests
        run: cargo test --locked -- --ignored

      - name: Formatting
        run: cargo fmt --check

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build-binaries:
    needs: build-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: wikipedia-to-epub-linux
            binary_ext: ""
          - os: macos-latest
            artifact_name: wikipedia-to-epub-macos
            binary_ext: ""
          - os: windows-latest
            artifact_name: wikipedia-to-epub-windows
            binary_ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Build executable
        run: cargo build --locked --release

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/wikipedia-to-epub${{ matrix.binary_ext }}
          if-no-files-found: error

  generate-site:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - build-binaries

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Download compiled binaries
        uses: actions/download-artifact@v8
        with:
          pattern: wikipedia-to-epub-*
          path: site/downloads

      - name: Generate GitHub Pages site
        run: |
          uv run tools/generate_site.py \
            --template templates/site/index.html.j2 \
            --output-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-site
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
