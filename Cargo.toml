[package]
name = "wikipedia-to-epub"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Command line tool to generate epub book from Wikipedia pages"
keywords = ["cli", "kindle", "wikipedia", "epub"]
categories = ["command-line-utilities"]
readme = "README.md"
repository = "https://github.com/szabgab/wikipedia-to-epub.rs/"
homepage = "https://wikipedia-to-epub.code-maven.com/"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
html-escape = "0.2.13"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
similar = "2.7.0"
